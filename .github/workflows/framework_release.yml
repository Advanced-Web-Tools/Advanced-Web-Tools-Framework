name: Framework release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: framework-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository and tags
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Calculate next version
        id: version
        shell: python
        run: |
          import os
          import re
          import subprocess

          tags = subprocess.check_output(
              ["git", "tag", "--list"],
              text=True
          ).splitlines()

          versions = []

          for tag in tags:
              match = re.fullmatch(r"v?(\d+)\.(\d+)\.(\d+)", tag)
              if match:
                  versions.append(tuple(map(int, match.groups())))

          if versions:
              major, minor, patch = max(versions)
              version = f"{major}.{minor}.{patch + 1}"
          else:
              version = "1.0.0"

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"tag={version}\n")

      - name: Create ZIP without a wrapper folder
        run: |
          git archive \
            --format=zip \
            --output="$RUNNER_TEMP/Advanced-Web-Tools-Framework.zip" \
            HEAD

      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$VERSION" \
            "$RUNNER_TEMP/Advanced-Web-Tools-Framework.zip" \
            --target "$GITHUB_SHA" \
            --title "AWT Framework $VERSION" \
            --generate-notes
